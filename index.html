<!DOCTYPE html>
<html lang="fr" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyRAG - Local AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class', // Activation du mode sombre manuel
            theme: {
                extend: {
                    colors: { brand: '#0ea5e9', brandDark: '#0284c7' }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 h-screen flex flex-col font-sans transition-colors duration-300">
    
    <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 p-4 shadow-sm flex flex-col sm:flex-row justify-between items-center gap-4 z-10 transition-colors duration-300">
        <h1 class="text-xl font-bold flex items-center gap-2 text-gray-800 dark:text-white">
            <span>🧠</span> MyRAG <span class="text-brand font-light">Local</span>
        </h1>
        
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 bg-gray-50 dark:bg-gray-700 p-2 rounded-lg border border-gray-200 dark:border-gray-600 transition-colors duration-300">
                <span class="text-sm text-gray-500 dark:text-gray-300 font-medium ml-1">📂 Source :</span>
                
                <select id="source-select" class="bg-transparent text-sm focus:outline-none text-gray-700 dark:text-gray-100 cursor-pointer font-medium" onchange="handleSourceChange()">
                    <option value="./data" class="dark:bg-gray-800">📁 ./data (Par défaut)</option>
                    <option value="custom" class="dark:bg-gray-800">🔍 Parcourir le Mac...</option>
                </select>
                
                <input type="text" id="custom-path-input" readonly placeholder="Chemin sélectionné..." class="hidden bg-white dark:bg-gray-600 border border-gray-300 dark:border-gray-500 rounded px-3 py-1.5 text-sm text-gray-700 dark:text-gray-200 focus:outline-none w-56 shadow-sm">
                
                <button onclick="changeSource()" id="reload-btn" class="ml-2 bg-gray-800 hover:bg-gray-700 dark:bg-gray-600 dark:hover:bg-gray-500 text-white px-4 py-1.5 rounded text-sm font-semibold transition-colors flex items-center gap-1 shadow-sm">
                    <span>🔄</span> Recharger
                </button>
            </div>

            <button onclick="toggleTheme()" id="theme-toggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors text-xl">
                🌙
            </button>
        </div>
    </header>

    <main id="chat" class="flex-1 overflow-y-auto p-4 sm:p-6 flex flex-col gap-6 max-w-4xl w-full mx-auto">
        <div class="flex flex-col max-w-3xl self-start w-full">
            <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 p-5 rounded-2xl rounded-tl-sm shadow-sm text-gray-700 dark:text-gray-200 leading-relaxed text-base transition-colors duration-300">
                Bonjour Arthur ! Je suis branché sur ton Mac. Choisis un dossier ou pose-moi une question ! 🚀
            </div>
        </div>
    </main>

    <footer class="bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 p-4 sm:p-6 flex justify-center transition-colors duration-300">
        <div class="flex w-full max-w-4xl gap-3">
            <input type="text" id="question" placeholder="Pose une question..." autocomplete="off" onkeypress="handleKeyPress(event)" class="flex-1 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 focus:border-brand dark:focus:border-brand rounded-xl px-5 py-3.5 text-gray-700 dark:text-gray-100 outline-none transition-all shadow-sm">
            <button onclick="askQuestion()" class="bg-brand hover:bg-brandDark text-white px-6 py-3.5 rounded-xl font-bold transition-all shadow-md flex items-center gap-2">
                Envoyer <span class="text-xl">↗</span>
            </button>
        </div>
    </footer>

    <script>
        const chatBox = document.getElementById("chat");
        const inputField = document.getElementById("question");
        const sourceSelect = document.getElementById("source-select");
        const customPathInput = document.getElementById("custom-path-input");
        const reloadBtn = document.getElementById("reload-btn");
        const themeToggle = document.getElementById("theme-toggle");
        const htmlElement = document.documentElement;

        // --- GESTION DU MODE SOMBRE ---
        function toggleTheme() {
            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                themeToggle.innerHTML = "🌙";
            } else {
                htmlElement.classList.add('dark');
                themeToggle.innerHTML = "☀️";
            }
        }

        // --- SÉLECTION DE DOSSIER NATIF MAC ---
        async function handleSourceChange() {
            if (sourceSelect.value === "custom") {
                // Fait appel à AppleScript via FastAPI
                const res = await fetch("/pick_folder");
                const data = await res.json();
                
                if (data.path) {
                    // Si l'utilisateur a choisi un dossier
                    customPathInput.value = data.path;
                    customPathInput.classList.remove("hidden");
                } else {
                    // Si l'utilisateur a annulé, on remet ./data
                    sourceSelect.value = "./data";
                    customPathInput.classList.add("hidden");
                }
            } else {
                customPathInput.classList.add("hidden");
            }
        }

        function handleKeyPress(e) {
            if (e.key === "Enter") askQuestion();
        }

        // --- APPEL API : CHANGEMENT DE SOURCE ---
        async function changeSource() {
            let targetPath = sourceSelect.value === "custom" ? customPathInput.value : "./data";

            reloadBtn.innerHTML = `<span>⏳</span>...`;
            reloadBtn.disabled = true;
            
            const sysId = "sys-" + Date.now();
            chatBox.innerHTML += `<div class="flex flex-col max-w-3xl self-center w-full my-4" id="${sysId}">
                <div class="bg-amber-50 dark:bg-amber-900/40 border border-amber-200 dark:border-amber-700 text-amber-700 dark:text-amber-400 p-3 rounded-xl text-center text-sm font-medium shadow-sm animate-pulse">
                    ⚙️ Reconstruction depuis : ${targetPath}...
                </div>
            </div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch("/change_source", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ path: targetPath })
                });
                const data = await response.json();

                if(data.status === "success") {
                    document.getElementById(sysId).innerHTML = `<div class="bg-emerald-50 dark:bg-emerald-900/40 border border-emerald-200 dark:border-emerald-700 text-emerald-700 dark:text-emerald-400 p-3 rounded-xl text-center text-sm font-medium shadow-sm">✅ ${data.message}</div>`;
                } else {
                    document.getElementById(sysId).innerHTML = `<div class="bg-red-50 dark:bg-red-900/40 border border-red-200 dark:border-red-700 text-red-700 dark:text-red-400 p-3 rounded-xl text-center text-sm font-medium shadow-sm">❌ ${data.message}</div>`;
                }
            } catch (error) {
                document.getElementById(sysId).innerHTML = `<div class="bg-red-50 dark:bg-red-900/40 border border-red-200 dark:border-red-700 text-red-700 dark:text-red-400 p-3 rounded-xl text-center text-sm font-medium shadow-sm">❌ Erreur réseau.</div>`;
            }

            reloadBtn.innerHTML = `<span>🔄</span> Recharger`;
            reloadBtn.disabled = false;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // --- APPEL API : DISCUSSION ---
        async function askQuestion() {
            const question = inputField.value.trim();
            if (!question) return;

            chatBox.innerHTML += `
            <div class="flex flex-col max-w-3xl self-end ml-auto w-full items-end">
                <div class="bg-brand text-white p-4 rounded-2xl rounded-tr-sm shadow-md text-base">
                    ${question}
                </div>
            </div>`;
            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            const loadingId = "load-" + Date.now();
            chatBox.innerHTML += `
            <div class="flex flex-col max-w-3xl self-start w-full" id="${loadingId}">
                <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 p-5 rounded-2xl rounded-tl-sm shadow-sm text-brand dark:text-brand font-medium italic animate-pulse">
                    🔍 MyRAG réfléchit...
                </div>
            </div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question: question })
                });
                const data = await response.json();

                let sourcesHtml = "";
                if (data.sources && data.sources.length > 0) {
                    const sourcesList = data.sources.map(s => `<li class="truncate text-gray-500 dark:text-gray-400 py-0.5">• ${s}</li>`).join('');
                    sourcesHtml = `
                    <div class="mt-4 pt-4 border-t border-gray-100 dark:border-gray-700 text-sm">
                        <strong class="text-gray-700 dark:text-gray-300 font-semibold flex items-center gap-1">📂 Sources utilisées :</strong>
                        <ul class="mt-2 space-y-1">${sourcesList}</ul>
                        <div class="mt-3 text-gray-400 dark:text-gray-500 text-xs font-mono bg-gray-50 dark:bg-gray-700 p-2 rounded inline-block">⏱️ ${data.time} s | 📍 ${data.current_path}</div>
                    </div>`;
                }
                
                const formattedAnswer = data.answer.replace(/\n/g, '<br>');
                
                document.getElementById(loadingId).innerHTML = `
                <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 p-5 rounded-2xl rounded-tl-sm shadow-sm text-gray-700 dark:text-gray-200 leading-relaxed text-base">
                    ${formattedAnswer}
                    ${sourcesHtml}
                </div>`;
                
            } catch (error) {
                document.getElementById(loadingId).innerHTML = `
                <div class="bg-red-50 dark:bg-red-900/40 border border-red-200 dark:border-red-700 p-5 rounded-2xl rounded-tl-sm shadow-sm text-red-600 dark:text-red-400 font-medium">
                    ❌ Erreur : Impossible de joindre le serveur.
                </div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
